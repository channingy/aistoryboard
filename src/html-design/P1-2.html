<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>剧本录入预览 - P1</title>
    <style>
        /* 模拟Element Plus基础样式 */
        :root {
            --el-color-primary: #409EFF;
            --el-color-success: #67C23A;
            --el-color-danger: #F56C6C;
            --el-border-color: #DCDFE6;
            --el-bg-color: #f5f7fa;
        }

        body {
            margin: 0;
            font-family: "Helvetica Neue", Helvetica, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", Arial, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
        }

        .script-container {
            width: min(90%, 1200px);
            margin: 2rem auto;
            padding: 2rem;
            background: white;
            border-radius: 16px;
            box-shadow: 0 12px 32px rgba(0,0,0,0.1);
        }

        .mode-switch {
            width: 100%;
            padding: 12px;
            background: var(--el-color-primary);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .mode-switch:hover {
            background: #337ecc;
        }

        .content-area {
            margin-top: 1.5rem;
            border: 2px dashed var(--el-border-color);
            border-radius: 8px;
            min-height: 300px;
            padding: 2rem;
            position: relative;
            transition: border-color 0.3s;
        }

        .content-area:hover {
            border-color: var(--el-color-primary);
        }

        #textInput {
            width: 100%;
            height: 400px;
            padding: 1rem;
            border: 1px solid var(--el-border-color);
            border-radius: 8px;
            resize: none;
            font-size: 16px;
            line-height: 1.6;
        }

        .counter {
            position: absolute;
            right: 1rem;
            bottom: 1rem;
            color: #909399;
        }

        .parse-btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin-top: 1rem;
            background: var(--el-color-success);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .upload-tips {
            text-align: center;
            color: #606266;
        }

        .link {
            color: var(--el-color-primary);
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="script-container">
        <button class="mode-switch" onclick="toggleMode()">
            🗂️ 切换至文件上传模式
        </button>

        <!-- 文本输入模式 -->
        <div class="content-area" id="textMode">
            <textarea id="textInput" placeholder="请输入剧本内容（最多1000字）" 
                     oninput="updateCounter()"></textarea>
            <div class="counter">
                <span id="counter">0/1000</span>
            </div>
            <button class="parse-btn">开始解析</button>
        </div>

        <!-- 文件上传模式 -->
        <div class="content-area" id="fileMode" style="display: none;">
            <div class="upload-tips">
                <p>拖放文件到此处 或 <span class="link">浏览文件</span></p>
                <p><small>支持格式：.xlsx, .xls, .csv</small></p>
            </div>
        </div>
    </div>

    <script>
        let isFileMode = false;

        function toggleMode() {
            isFileMode = !isFileMode;
            document.getElementById('textMode').style.display = isFileMode ? 'none' : 'block';
            document.getElementById('fileMode').style.display = isFileMode ? 'block' : 'none';
            document.querySelector('.mode-switch').textContent = isFileMode ? 
                '📝 切换至文本输入模式' : '🗂️ 切换至文件上传模式';
        }

        function updateCounter() {
            const textarea = document.getElementById('textInput');
            const counter = document.getElementById('counter');
            const count = textarea.value.length;
            counter.textContent = `${count}/1000`;
            counter.style.color = count >= 1000 ? 'var(--el-color-danger)' : '#909399';
        }

        // 简易拖拽交互
        const dropZone = document.getElementById('fileMode');
        dropZone.addEventListener('dragover', e => {
            e.preventDefault();
            dropZone.style.borderColor = 'var(--el-color-primary)';
        });
        
        dropZone.addEventListener('dragleave', () => {
            dropZone.style.borderColor = 'var(--el-border-color)';
        });
    </script>
</body>
</html>
